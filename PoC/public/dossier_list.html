    <title>Liste des Dossiers</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Menu de navigation -->
    <nav>
        <ul>
            <li><a href="user.html">Mon Profil</a></li>
            <li><a href="dossier.html">Créer un Dossier</a></li>

            <li><a href="#" id="logoutButton">Se Déconnecter</a></li>
        </ul>

    <div class="container">
        <h2>Liste des Dossiers</h2>
        <table id="dossierTable">
            <thead>
                <tr>
                    <th>Nom</th>
                    <th>Description</th>
                    <th>Date de Création</th>

        </div>
    </div>

    <script src="dossier_list.js"></script>
