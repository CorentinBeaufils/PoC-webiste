<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilisateur Connecté</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <nav>
        <ul>
            <li><a href="user.html">Mon Profil</a></li>
            <li><a href="dossier.html">Créer un Dossier</a></li>
            <li><a href="dossier_list.html">Voir les Dossiers</a></li>
            <li><a href="#" id="logoutButton">Se Déconnecter</a></li>
        </ul>
    </nav>

    <div class="container">
        <h2>Bienvenue, <span id="userEmail"></span>!</h2>

        <!-- Formulaire de création et suppression d'utilisateurs (affiché si admin) -->
        <div id="adminActions" style="display: none;">
            <h3>Actions Administrateur</h3>

            <!-- Formulaire pour créer un utilisateur -->
            <form id="createUserForm">
                <h4>Créer un utilisateur</h4>
                <input type="text" id="nom" placeholder="Nom" required>
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="mot_de_passe" placeholder="Mot de passe" required>
                <select id="role">
                    <option value="user">Utilisateur</option>
                    <option value="admin">Administrateur</option>
                </select>
                <button type="submit">Créer un utilisateur</button>
                <p id="createMessage"></p>
            </form>

            <!-- Formulaire pour supprimer un utilisateur -->
            <form id="deleteUserForm">
                <h4>Supprimer un utilisateur</h4>
                <input type="email" id="deleteEmail" placeholder="Email de l'utilisateur à supprimer" required>
                <button type="submit">Supprimer l'utilisateur</button>
                <p id="deleteMessage"></p>
            </form>
        </div>
    </div>

    <script>
        // Récupérer le token JWT stocké dans localStorage
        const token = localStorage.getItem('token');

        // Vérifier si le token existe
        if (token) {
            // Décoder le token pour obtenir les informations de l'utilisateur
            const payload = JSON.parse(atob(token.split('.')[1]));

            // Afficher l'email de l'utilisateur
            document.getElementById('userEmail').textContent = payload.email;

            // Vérifier si l'utilisateur est administrateur
            if (payload.role === 'admin') {
                // Afficher les actions administrateur
                document.getElementById('adminActions').style.display = 'block';
            }
        } else {
            // Si pas de token, rediriger vers la page de connexion
            window.location.href = 'login.html';
        }

        // Gestion de la création d'utilisateur
        document.getElementById('createUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const nom = document.getElementById('nom').value;
            const email = document.getElementById('email').value;
            const mot_de_passe = document.getElementById('mot_de_passe').value;
            const role = document.getElementById('role').value;

            try {
                const response = await fetch('/inscription', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ nom, email, mot_de_passe, role })
                });

                const data = await response.json();
                if (response.ok) {
                    document.getElementById('createMessage').textContent = 'Utilisateur créé avec succès.';
                } else {
                    document.getElementById('createMessage').textContent = data.message || 'Erreur lors de la création de l\'utilisateur.';
                }
            } catch (error) {
                document.getElementById('createMessage').textContent = 'Erreur lors de la création de l\'utilisateur.';
                console.error('Erreur:', error);
            }
        });

        // Gestion de la suppression d'utilisateur
        document.getElementById('deleteUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('deleteEmail').value;

            try {
                const response = await fetch('/supprimer_utilisateur', {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();
                if (response.ok) {
                    document.getElementById('deleteMessage').textContent = 'Utilisateur supprimé avec succès.';
                } else {
                    document.getElementById('deleteMessage').textContent = data.message || 'Erreur lors de la suppression de l\'utilisateur.';
                }
            } catch (error) {
                document.getElementById('deleteMessage').textContent = 'Erreur lors de la suppression de l\'utilisateur.';
                console.error('Erreur:', error);
            }
        });

        // Fonction de déconnexion
        document.getElementById('logoutButton').addEventListener('click', () => {
            localStorage.removeItem('token'); // Supprimer le token
            window.location.href = 'login.html'; // Rediriger vers la page de connexion
        });
    </script>
</body>

</html>
